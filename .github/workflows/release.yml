name: Release Desktop Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run

      - name: Build web app
        run: npm run build

      - name: Build website
        run: npm run site:build

  release:
    name: Build ${{ matrix.label }}
    needs: quality
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Universal
            runner: macos-14
            rust-target: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin
            experimental: false
          - label: Windows x64
            runner: windows-latest
            rust-target: x86_64-pc-windows-msvc
            tauri-args: --target x86_64-pc-windows-msvc
            experimental: false
          - label: Windows ARM64
            runner: windows-11-arm
            rust-target: aarch64-pc-windows-msvc
            tauri-args: --target aarch64-pc-windows-msvc
            experimental: true
          - label: Linux x64
            runner: ubuntu-24.04
            rust-target: x86_64-unknown-linux-gnu
            tauri-args: --target x86_64-unknown-linux-gnu
            experimental: false
          - label: Linux ARM64
            runner: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu
            tauri-args: --target aarch64-unknown-linux-gnu
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Knowa v__VERSION__
          releaseBody: |
            # Knowa v__VERSION__ 发布说明

            Knowa 是一款本地优先的个人题库与刷题应用，适合备考、教学资料整理、错题复盘和长期知识管理。题库、图片、做题记录、收藏、错题集、笔记和备份都优先保存在用户自己的设备中。

            ## 本次发布重点

            - 支持题库创建、题目编辑、题库详情统计和题库进度展示。
            - 支持单选题、多选题、判断题，以及富文本题干、选项、解析和笔记。
            - 支持 Markdown 批量导入，包含模板、实时预览、公式和代码渲染。
            - 支持按章节、节、知识点、顺序和随机方式刷题。
            - 支持练习模式、考试模式、自定义倒计时和统一交卷。
            - 支持答题完成页、题号导航、正误颜色、正确答案和解析回顾。
            - 支持收藏、错题集、我的笔记、做题记录和题组重做。
            - 支持题库、收藏、错题、笔记的选择性导出与打印。
            - 支持 `.exlocal` 完整数据备份，包含题库、题目、记录、设置、笔记和图片。
            - 支持 Tauri 桌面端本地备份目录、文件关联和跨设备迁移。

            ## 下载建议

            - macOS：优先下载 Universal DMG，兼容 Apple Silicon 和 Intel Mac。
            - Windows：普通电脑下载 x64 安装包；ARM 设备可尝试 ARM64 安装包。
            - Linux：优先选择 AppImage；也可以按发行版选择 deb 或 rpm。

            ## 数据说明

            Knowa 默认本地存储。桌面端可以设置固定本地备份目录，并导出 `.exlocal` 完整备份包。换设备时导入该备份包即可衔接题库、记录、笔记和图片。

            ## 已知限制

            当前版本仍以本地单机学习工作流为核心，暂不包含云同步和账号系统。后续版本会继续优化桌面端体验、导出排版、示例题库和官网教程。
          releaseDraft: false
          prerelease: false
          updaterJsonKeepUniversal: true
          args: ${{ matrix.tauri-args }}
