<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Knowa</title>
    <link rel="icon" href="%BASE_URL%favicon.svg" />
    <style>
      :root {
        color-scheme: light;
        background: #fbf7ef;
      }

      body {
        margin: 0;
        background: #fbf7ef;
      }

      .boot-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 12%, rgba(70, 102, 85, 0.12), transparent 30%),
          radial-gradient(circle at 82% 18%, rgba(59, 75, 107, 0.1), transparent 28%),
          #fbf7ef;
        color: #263027;
        font-family: Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      .boot-card {
        display: grid;
        gap: 14px;
        justify-items: center;
        padding: 32px;
      }

      .boot-mark {
        width: 72px;
        height: 72px;
        border-radius: 22px;
        display: grid;
        place-items: center;
        background: #466655;
        box-shadow: 0 18px 40px rgba(38, 48, 39, 0.18);
      }

      .boot-mark svg {
        width: 42px;
        height: 42px;
      }

      .boot-title {
        margin: 0;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 0;
      }

      .boot-subtitle {
        margin: 0;
        color: #697165;
        font-size: 14px;
      }

      .boot-dots {
        display: flex;
        gap: 6px;
        margin-top: 2px;
      }

      .boot-dots span {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: #466655;
        animation: knowa-boot-pulse 1.2s ease-in-out infinite;
      }

      .boot-dots span:nth-child(2) {
        animation-delay: 0.16s;
      }

      .boot-dots span:nth-child(3) {
        animation-delay: 0.32s;
      }

      @keyframes knowa-boot-pulse {
        0%, 80%, 100% {
          opacity: 0.28;
          transform: translateY(0);
        }

        40% {
          opacity: 1;
          transform: translateY(-4px);
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" aria-label="Knowa 正在启动">
        <div class="boot-card">
          <div class="boot-mark" aria-hidden="true">
            <svg viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M29 25h23c10 0 17 7 17 17v28H46c-10 0-17-7-17-17V25Z" fill="#f5f7f0"/>
              <path d="M46 25v45" stroke="#466655" stroke-width="6" stroke-linecap="round"/>
              <path d="M59 39H39M59 52H39" stroke="#466655" stroke-width="5.5" stroke-linecap="round"/>
            </svg>
          </div>
          <h1 class="boot-title">Knowa</h1>
          <p class="boot-subtitle">搭建你的个人题库</p>
          <div class="boot-dots" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
